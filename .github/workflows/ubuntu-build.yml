# This is a basic workflow to help you get started with Actions

name: Build source on Ubuntu 26.04 LTS

# Controls when the workflow will run
on:
  # Run downstream source compilation for niri-plus changes.
  push:
    branches: [ niri-plus ]
  pull_request:
    branches: [ niri-plus ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ubuntu-build:
    container: ubuntu:26.04
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    permissions:
      contents: read
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ninja-build meson \
            libwayland-dev libgtk-4-dev gobject-introspection \
            libgirepository1.0-dev valac libjson-glib-dev \
            libgtk4-layer-shell-dev scdoc libgee-0.8-dev libpulse-dev \
            sassc libgranite-7-dev blueprint-compiler libadwaita-1-dev

      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Meson configure
        run: meson setup build

      - name: Build
        run: ninja -C build
