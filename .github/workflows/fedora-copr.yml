name: Publish upstream Fedora Copr package

on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  fedora-copr:
    if: github.repository == 'ErikReider/SwayNotificationCenter'
    container: registry.fedoraproject.org/fedora-minimal:latest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install API token for copr-cli
        env:
          API_LOGIN: ${{ secrets.COPR_API_LOGIN }}
          API_USERNAME: ${{ secrets.COPR_API_USERNAME }}
          API_TOKEN_CONTENT: ${{ secrets.COPR_API_TOKEN }}
        run: |
          mkdir -p "$HOME/.config"
          # To generate a new token: https://copr.fedorainfracloud.org/api/.
          {
            echo "[copr-cli]"
            echo "login = $API_LOGIN"
            echo "username = $API_USERNAME"
            echo "token = $API_TOKEN_CONTENT"
            echo "copr_url = https://copr.fedorainfracloud.org"
          } >> "$HOME/.config/copr"

      - name: Install tooling for source RPM build
        run: |
          microdnf -y install --nodocs --setopt=install_weak_deps=0 \
            copr-cli rpkg git

      # It is necessary to checkout into sub-directory, because of some weird ownership problems cause by using containers
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          path: swaync

      - name: Copy spec into root dir
        run: |
          cd swaync
          cp ./build-scripts/swaync.rpkg.spec ./

      - name: Submit the build to copr
        env:
          COPR_REPO_NAME: ${{ secrets.COPR_REPO_NAME }}
        run: |
          cd swaync
          rpkg -v copr-build -w "$COPR_REPO_NAME"
