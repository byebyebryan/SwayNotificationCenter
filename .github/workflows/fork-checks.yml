name: Fork checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install build and private native test dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git gtk4 gtk4-layer-shell libadwaita \
            glib2 libgee json-glib libpulse granite7 vala meson scdoc sassc \
            gobject-introspection blueprint-compiler python python-gobject \
            dbus xorg-server-xvfb xorg-xauth niri kitty mesa noto-fonts

      - name: Check out fork source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare an ordinary test user
        run: |
          useradd --create-home fork-check
          chown -R fork-check "$GITHUB_WORKSPACE"

      - name: Check the fork on private displays and buses
        run: runuser -u fork-check -- python tests/check-fork.py --compositor

      - name: Record the check environment
        if: always()
        run: |
          mkdir -p build/fork-check-artifacts
          pacman -Q > build/fork-check-artifacts/packages.txt

      - name: Upload native captures and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-native-checks
          path: build/fork-check-artifacts

  arch-recipe:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    env:
      MAKEFLAGS: -j2
    steps:
      - name: Install canonical package build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git python gtk4 gtk4-layer-shell \
            libadwaita glib2 libgee json-glib libpulse granite7 vala meson \
            scdoc sassc gobject-introspection blueprint-compiler

      - name: Check out recipe and verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare an ordinary package builder
        run: |
          useradd --create-home fork-package
          chown -R fork-package "$GITHUB_WORKSPACE"

      - name: Build the canonical pinned archive and execute recipe checks
        run: runuser -u fork-package -- python tests/check-arch-recipe.py

      - name: Record the package build environment
        if: always()
        run: |
          mkdir -p build/fork-package-artifacts
          pacman -Q > build/fork-package-artifacts/packages.txt

      - name: Upload package, metadata and checksum receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-canonical-package
          path: build/fork-package-artifacts

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check package identity and release failure cases
        run: python3 -m unittest discover -s tests -p 'test_fork_ci.py' -v
      - name: Check all workflow syntax and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  required:
    name: Fork required checks
    if: always()
    needs: [native, arch-recipe, policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require every prerequisite to succeed
        env:
          FORK_CHECK_NEEDS: ${{ toJSON(needs) }}
        run: python3 tests/check-ci-gate.py
