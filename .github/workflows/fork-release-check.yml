name: Check fork release readiness

on:
  workflow_dispatch:
    inputs:
      recipe_commit:
        description: Full published recipe commit to qualify before release
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and recipe check results
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RECIPE_COMMIT: ${{ inputs.recipe_commit }}
        run: |
          python3 tests/check-release.py --repo "$REPOSITORY" \
            --recipe-commit "$RECIPE_COMMIT" --output build/fork-release-readiness.json
      - name: Upload readiness receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-release-readiness
          path: build/fork-release-readiness.json
          if-no-files-found: ignore
